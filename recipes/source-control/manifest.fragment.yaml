# Merge this fragment into manifest.yaml only when enabling the source-control
# recipe. Replace every `acme` identifier and label consistently.
#
# Do not copy the template's 0.86.0 minimum. Set min_kandev_version to the first
# released Kandev version containing these provider/reference contracts. At the
# time this recipe was added, they existed after v0.87.1 but had no release tag.

# These are required only by the sample Host-backed repository resolver and
# Host-state association store. Remove any capability your concrete adapters do
# not use.
capabilities:
  api_read: ["tasks", "repositories"]
  state: true

# Browser bodies are untrusted and bounded. Kandev authorizes each selector,
# passes it separately as VerifiedActionContext, and propagates cancellation.
actions:
  - key: "repositories.list"
    scope: "workspace"
    max_body_bytes: 16384
  - key: "repositories.inspect"
    scope: "workspace"
    max_body_bytes: 16384
  - key: "repositories.branches"
    scope: "workspace"
    max_body_bytes: 16384
  - key: "change_requests.create"
    scope: "task"
    max_body_bytes: 65536
  - key: "change_requests.get"
    scope: "task"
    max_body_bytes: 1024
  - key: "change_requests.link"
    scope: "task"
    max_body_bytes: 16384
  - key: "change_requests.unlink"
    scope: "task"
    max_body_bytes: 4096
  - key: "change_requests.associations"
    scope: "workspace"
    max_body_bytes: 1024

repository_providers: ["acme"]

reference_sources:
  - source: "acme_change_requests"
    provider: "acme"
    kind: "change_request"
    display_name: "Acme change requests"
    kind_label: "Change request"
    order: 100
