# kandev plugin manifest — the single declarative contract between this
# plugin and a kandev host. Everything kandev needs to install, spawn, and
# route to the plugin is described here.
#
# `id` MUST match the Go module name in go.mod and the id passed to
# window.registerKandevPlugin(...) in ui/bundle.js, and it is the prefix of
# every route kandev serves for this plugin (/api/plugins/<id>/...). Keep the
# three in sync when you rename.
id: "kandev-plugin-deepseek-balance"
api_version: 1
version: "0.1.1"
display_name: "DeepSeek API Balance"
description: "Shows DeepSeek API balance and credit breakdown in configurable task and prompt locations."
author: "Fclem"
categories: ["analytics"]
repo_url: "https://github.com/Fclem/kandev-plugin-deepseek-balance"

# min_kandev_version is the oldest kandev release this plugin will install
# against. A release host compares it to its own version at install time and
# refuses the package if it is older, so an operator gets a clear error instead
# of a plugin that loads and then fails on a missing API.
#
# 0.88.0 is the floor for this plugin: it is the first release carrying
# authenticated plugin actions (pluginsdk.HandleAction, PR #2117).
#
# Two things worth knowing about the check. It only became load-bearing in
# 0.86.0 — earlier hosts parsed the field and silently ignored it. And it is
# release-only by design: a host built from a git checkout reports something
# like "v0.87.1-27-g4705f1fd0", which is not a release version, so the gate is
# skipped and the install succeeds whatever you put here. Don't read a
# successful sideload onto your dev instance as proof the floor is right.
min_kandev_version: "0.88.0"

# runtime.executables maps each supported platform to the binary kandev
# spawns as a gRPC subprocess. `make package` cross-compiles all five;
# `make package-host` builds just the current one. The paths are relative to
# the package root and must match what the Makefile writes into server/.
runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

# This plugin declares no capabilities (no events, no host state, no data
# reads) and no webhooks: the only data path is the authenticated balance.get
# action, so balance data is never reachable over an unauthenticated route.

# ui.bundle points at the hand-written, no-build ES module frontend half.
ui:
  bundle: "/ui/bundle.js"

# config_schema declares operator-editable settings, rendered as a form at
# Settings > Plugins > DeepSeek API Balance. The plugin process reads saved values
# through the Host GetConfig RPC. Fields marked `secret: true` render as
# password inputs, are stored in kandev's encrypted vault, and are masked
# everywhere except inside the plugin process.
config_schema:
  type: object
  properties:
    api_key:
      type: string
      format: password
      secret: true
      title: "DeepSeek API key"
      description: "DeepSeek API key used to read the account balance. Leave empty or blank to fall back to the DEEPSEEK_API_KEY environment variable."
    poll_minutes:
      type: number
      default: 5
      minimum: 1
      title: "Refresh interval (min)"
      description: "How often the balance refreshes in the background. Default 5, minimum 1."
    warn_below:
      type: number
      default: 10
      title: "Warn threshold"
      description: "The pill turns amber when the primary-currency total balance falls below this amount. Default 10."
    display_task_top_right:
      type: boolean
      default: true
      title: "Display · Task top right"
      description: "Show the balance pill in the task session top bar."
    display_prompt_input:
      type: boolean
      default: false
      title: "Display · Prompt input"
      description: "Show the balance pill in the prompt toolbar next to the send button."

# Authenticated actions. The workspace action serves the task top bar; the
# task-scoped variant serves the prompt toolbar, whose slot context provides a
# task id but not a workspace id.
actions:
  - key: balance.get
    scope: workspace
    max_body_bytes: 1024
  - key: balance.get.task
    scope: task
    max_body_bytes: 1024
